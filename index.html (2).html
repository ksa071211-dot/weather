<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet 도시별 실시간 날씨 지도</title>
    
    <!-- Leaflet CSS (unpkg 기본, cdnjs 백업) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" id="leaflet-css" />
    <script>
        // CSS 로딩 실패 시 cdnjs로 자동 대체
        document.getElementById('leaflet-css').onerror = function() {
            this.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
        };
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* UI 컨트롤 패널 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
            max-width: 320px;
            width: calc(100% - 40px);
        }

        .control-panel h1 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ff8e53;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-panel p {
            font-size: 0.82rem;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .city-select {
            width: 100%;
            padding: 10px 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        /* 마커 핀 스타일 (코랄/오렌지 그라데이션) */
        .custom-pin-container {
            position: relative;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-pin {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border: 2px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .custom-pin-inner {
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
        }

        .custom-pin-pulse {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 8px;
            background: rgba(255, 107, 107, 0.4);
            border-radius: 50%;
            z-index: 1;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: translateX(-50%) scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: translateX(-50%) scale(2.2);
                opacity: 0;
            }
        }

        .custom-pin-container:hover .custom-pin {
            transform: rotate(-45deg) scale(1.2);
            background: linear-gradient(135deg, #ff5252, #ff793f);
            box-shadow: 0 6px 16px rgba(255, 82, 82, 0.7);
        }

        /* Leaflet 팝업 스타일 재정의 */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(8px);
            color: #f8fafc !important;
            border-radius: 16px !important;
            padding: 4px !important;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0,0,0,0
