<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leaflet 반응형 실시간 날씨 지도</title>
    
    <!-- Leaflet CSS (unpkg 기본, cdnjs 백업) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" id="leaflet-css" />
    <script>
        document.getElementById('leaflet-css').onerror = function() {
            this.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
        };
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* 접근성: 키보드 포커스 시 고대비링 표시 */
        a:focus-visible, button:focus-visible, select:focus-visible, [tabindex="0"]:focus-visible {
            outline: 3px solid #ff8e53 !important;
            outline-offset: 2px !important;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* 데스크톱 UI 컨트롤 패널 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
            max-width: 320px;
            width: calc(100% - 40px);
            transition: all 0.3s ease;
        }

        .control-panel h1 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ff8e53;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-panel p {
            font-size: 0.82rem;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .city-select-label {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .city-select {
            width: 100%;
            padding: 10px 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        /* 마커 핀 스타일 (코랄/오렌지 그라데이션) */
        .custom-pin-container {
            position: relative;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-pin {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border: 2px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
            z-index: 2;
        }

        .custom-pin-inner {
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
        }

        .custom-pin-pulse {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 8px;
            background: rgba(255, 107, 107, 0.4);
            border-radius: 50%;
            z-index: 1;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: translateX(-50%) scale(0.8); opacity: 0.8; }
            100% { transform: translateX(-50%) scale(2.2); opacity: 0; }
        }

        /* ✨ 마커 호버 시 부드럽고 은은하게 흔들리는 애니메이션 */
        .custom-pin-container:hover .custom-pin {
            animation: marker-soft-tilt 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            background: linear-gradient(135deg, #ff5252, #ff793f);
            box-shadow: 0 6px 16px rgba(255, 82, 82, 0.6);
        }

        @keyframes marker-soft-tilt {
            0%, 100% {
                transform: rotate(-45deg) translate(0, 0);
            }
            25% {
                transform: rotate(-41deg) translate(-1px, -2px);
            }
            75% {
                transform: rotate(-49deg) translate(1px, -1px);
            }
        }

        /* Leaflet 팝업 기본 스타일 */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(8px);
            color: #f8fafc !important;
            border-radius: 16px !important;
            padding: 4px !important;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6) !important;
        }

        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.95) !important;
        }

        .weather-popup {
            padding: 12px;
            min-width: 190px;
            text-align: center;
        }

        .weather-popup h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ff8e53;
            margin-bottom: 2px;
        }

        .weather-popup .country {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .weather-info-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 8px 0;
        }

        .weather-icon {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .temp {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .desc {
            font-size: 0.9rem;
            color: #e2e8f0;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            color: #cbd5e1;
        }

        .demo-notice {
            margin-top: 8px;
            font-size: 0.7rem;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            padding: 4px 6px;
            border-radius: 4px;
        }

        /* 📱 반응형: 스마트폰 화면 (max-width: 600px) */
        @media (max-width: 600px) {
            .control-panel {
                top: auto;
                bottom: 24px;
                left: 12px;
                width: calc(100% - 24px);
                max-width: none;
                padding: 12px 14px;
                border-radius: 12px;
            }

            .control-panel p {
                display: none;
            }

            .control-panel h1 {
                font-size: 0.95rem;
                margin-bottom: 8px;
            }

            .weather-popup {
                padding: 4px 8px;
                min-width: 120px;
            }

            .weather-popup h3 {
                font-size: 1rem;
            }

            .weather-popup .country,
            .weather-popup .desc,
            .weather-popup .demo-notice {
                display: none !important;
            }

            .weather-info-box {
                margin: 2px 0;
            }

            .weather-icon {
                width: 38px;
                height: 38px;
            }

            .temp {
                font-size: 1.5rem;
            }

            .weather-details {
                grid-template-columns: 1fr 1fr;
                gap: 4px;
                padding: 4px 6px;
                font-size: 0.72rem;
            }

            .weather-details div {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 2px;
            }

            .weather-details span.label {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- UI 컨트롤 패널 -->
    <main class="control-panel" role="region" aria-label="도시 날씨 검색 패널">
        <h1>📍 도시 실시간 날씨 지도</h1>
        <p>마커를 클릭하거나 도시를 선택하면 해당 지역의 날씨 정보를 확인할 수 있습니다.</p>
        
        <label for="citySelect" class="city-select-label">도시 바로가기 선택</label>
        <select class="city-select" id="citySelect" onchange="focusCity(this.value)" aria-label="조회할 도시 선택">
            <option value="">-- 도시 바로가기 --</option>
        </select>
    </main>

    <!-- 지도 표시 영역 -->
    <div id="map" role="application" aria-label="실시간 날씨 인터랙티브 지도"></div>

    <!-- Leaflet JS 다중 CDN 로더 -->
    <script>
        function loadScript(src, fallbackSrcs, callback) {
            var script = document.createElement('script');
            script.src = src;
            script.onload = callback;
            script.onerror = function() {
                if (fallbackSrcs.length > 0) {
                    console.warn('CDN 로딩 실패. 대체 CDN으로 전환:', fallbackSrcs[0]);
                    loadScript(fallbackSrcs.shift(), fallbackSrcs, callback);
                } else {
                    alert('지도 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.');
                }
            };
            document.head.appendChild(script);
        }

        window.onload = function() {
            loadScript(
                'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
                [
                    'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js',
                    'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'
                ],
                function() {
                    initMap();
                }
            );
        };
    </script>

    <script>
        const API_KEY = 'f738d53ea69e7fdd825364d81d17af21';

        const cities = [
            { name: "서울", country: "대한민국", lat: 37.5665, lng: 126.9780 },
            { name: "부산", country: "대한민국", lat: 35.1796, lng: 129.0756 },
            { name: "인천", country: "대한민국", lat: 37.4563, lng: 126.7052 },
            { name: "대구", country: "대한민국", lat: 35.8714, lng: 128.6014 },
            { name: "광주", country: "대한민국", lat: 35.1595, lng: 126.8526 },
            { name: "대전", country: "대한민국", lat: 36.3510, lng: 127.3850 },
            { name: "제주", country: "대한민국", lat: 33.4996, lng: 126.5312 },
            { name: "장흥", country: "대한민국", lat: 34.6817, lng: 126.9073 },
            { name: "도쿄", country: "일본", lat: 35.6762, lng: 139.6503 },
            { name: "런던", country: "영국", lat: 51.5074, lng: -0.1278 },
            { name: "뉴욕", country: "미국", lat: 40.7128, lng: -74.0060 },
            { name: "파리", country: "프랑스", lat: 48.8566, lng: 2.3522 }
        ];

        let map;
        const markers = {};

        function initMap() {
            if (typeof L === 'undefined') return;

            map = L.map('map', { zoomControl: false }).setView([36.5, 127.5], 7);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            const mainTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            mainTile.on('tileerror', function() {
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    attribution: '&copy; CartoDB'
                }).addTo(map);
            });

            setupCities();

            setTimeout(() => { map.invalidateSize(); }, 200);
        }

        function setupCities() {
            const selectEl = document.getElementById('citySelect');

            cities.forEach((city, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${city.name} (${city.country})`;
                selectEl.appendChild(option);

                const customIcon = L.divIcon({
                    className: 'custom-pin-wrapper',
                    html: `
                        <div class="custom-pin-container" tabindex="0" role="button" aria-label="${city.name} 날씨 확인">
                            <div class="custom-pin-pulse"></div>
                            <div class="custom-pin">
                                <div class="custom-pin-inner"></div>
                            </div>
                        </div>
                    `,
                    iconSize: [36, 36],
                    iconAnchor: [18, 36],
                    popupAnchor: [0, -36]
                });

                const marker = L.marker([city.lat, city.lng], { icon: customIcon }).addTo(map);
                markers[index] = marker;

                marker.on('click', () => {
                    fetchWeather(city, marker);
                });
            });
        }

        async function fetchWeather(city, marker) {
            marker.bindPopup(`
                <div class="weather-popup" aria-live="polite">
                    <h3>${city.name}</h3>
                    <div style="padding: 10px; color: #ff8e53; font-size: 0.85rem;">⏳ 로딩 중...</div>
                </div>
            `).openPopup();

            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lng}&appid=${API_KEY}&units=metric&lang=kr`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('API Error');
                
                const data = await response.json();
                renderWeatherPopup(marker, city, {
                    temp: Math.round(data.main.temp),
                    feels_like: Math.round(data.main.feels_like),
                    humidity: data.main.humidity,
                    wind: Math.round(data.wind.speed),
                    description: data.weather[0].description,
                    icon: `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`
                }, false);
            } catch (err) {
                renderWeatherPopup(marker, city, getMockData(), true);
            }
        }

        function renderWeatherPopup(marker, city, data, isMock) {
            const popupHtml = `
                <div class="weather-popup" aria-live="polite">
                    <h3>${city.name}</h3>
                    <div class="country">${city.country}</div>
                    
                    <div class="weather-info-box">
                        <img class="weather-icon" src="${data.icon}" alt="${data.description} 아이콘" />
                        <div class="temp" aria-label="현재 온도 ${data.temp}도">${data.temp}°C</div>
                    </div>
                    
                    <div class="desc">${data.description}</div>
                    
                    <div class="weather-details">
                        <div><span class="label">체감: </span><b>🌡️ ${data.feels_like}°</b></div>
                        <div><span class="label">습도: </span><b>💧 ${data.humidity}%</b></div>
                        <div><span class="label">풍속: </span><b>💨 ${data.wind}m/s</b></div>
                        <div><span class="label">위도: </span><b>📍 ${city.lat.toFixed(1)}°</b></div>
                    </div>
                    
                    ${isMock ? `<div class="demo-notice">⚠️ API 활성화 대기 중 (샘플 데이터)</div>` : ''}
                </div>
            `;
            marker.bindPopup(popupHtml).openPopup();
        }

        function getMockData() {
            return {
                temp: Math.floor(Math.random() * 10) + 15,
                feels_like: Math.floor(Math.random() * 10) + 14,
                humidity: Math.floor(Math.random() * 30) + 50,
                wind: Math.floor(Math.random() * 3) + 1,
                description: "맑음 (샘플)",
                icon: "https://openweathermap.org/img/wn/01d@2x.png"
            };
        }

        function focusCity(index) {
            if (index === "") return;
            const city = cities[index];
            map.flyTo([city.lat, city.lng], 10, { duration: 1.2 });
            setTimeout(() => fetchWeather(city, markers[index]), 1300);
        }
    </script>
</body>
</html>
