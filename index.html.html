<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet 도시별 실시간 날씨 지도</title>
    
    <!-- Leaflet CSS (unpkg 기본, cdnjs 백업) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" id="leaflet-css" />
    <script>
        // CSS 로딩 실패 시 cdnjs로 자동 대체
        document.getElementById('leaflet-css').onerror = function() {
            this.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
        };
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* UI 컨트롤 패널 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
            max-width: 320px;
            width: calc(100% - 40px);
        }

        .control-panel h1 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ff8e53;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-panel p {
            font-size: 0.82rem;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .city-select {
            width: 100%;
            padding: 10px 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        /* 마커 핀 스타일 (코랄/오렌지 그라데이션) */
        .custom-pin-container {
            position: relative;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-pin {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border: 2px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .custom-pin-inner {
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
        }

        .custom-pin-pulse {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 8px;
            background: rgba(255, 107, 107, 0.4);
            border-radius: 50%;
            z-index: 1;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: translateX(-50%) scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: translateX(-50%) scale(2.2);
                opacity: 0;
            }
        }

        .custom-pin-container:hover .custom-pin {
            transform: rotate(-45deg) scale(1.2);
            background: linear-gradient(135deg, #ff5252, #ff793f);
            box-shadow: 0 6px 16px rgba(255, 82, 82, 0.7);
        }

        /* Leaflet 팝업 스타일 재정의 */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(8px);
            color: #f8fafc !important;
            border-radius: 16px !important;
            padding: 4px !important;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6) !important;
        }

        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.95) !important;
        }

        .weather-popup {
            padding: 12px;
            min-width: 200px;
            text-align: center;
        }

        .weather-popup h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ff8e53;
            margin-bottom: 2px;
        }

        .weather-popup .country {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .weather-info-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 8px 0;
        }

        .weather-icon {
            width: 50px;
            height: 50px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .temp {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .desc {
            font-size: 0.9rem;
            color: #e2e8f0;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            color: #cbd5e1;
        }

        .demo-notice {
            margin-top: 8px;
            font-size: 0.7rem;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            padding: 4px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- UI 컨트롤 패널 -->
    <div class="control-panel">
        <h1>📍 도시 실시간 날씨 지도</h1>
        <p>마커를 클릭하거나 아래 목록에서 도시를 선택하면 해당 위치의 날씨 정보를 가져옵니다.</p>
        
        <select class="city-select" id="citySelect" onchange="focusCity(this.value)">
            <option value="">-- 도시 바로가기 --</option>
        </select>
    </div>

    <!-- 지도 영역 -->
    <div id="map"></div>

    <!-- Leaflet JS 다중 CDN 로더 (unpkg -> cdnjs -> jsDelivr 순서 자동 백업) -->
    <script>
        function loadScript(src, fallbackSrcs, callback) {
            var script = document.createElement('script');
            script.src = src;
            script.onload = callback;
            script.onerror = function() {
                if (fallbackSrcs.length > 0) {
                    console.warn('CDN 로딩 실패. 대체 CDN으로 전환합니다:', fallbackSrcs[0]);
                    loadScript(fallbackSrcs.shift(), fallbackSrcs, callback);
                } else {
                    alert('Leaflet 지도 라이브러리를 불러오지 못했습니다. 네트워크 상태를 확인해주세요.');
                }
            };
            document.head.appendChild(script);
        }

        window.onload = function() {
            loadScript(
                'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
                [
                    'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js',
                    'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'
                ],
                function() {
                    initMap();
                }
            );
        };
    </script>

    <script>
        // =========================================================================
        // 🔑 OpenWeatherMap API Key가 직접 입력되어 있습니다.
        // =========================================================================
        const API_KEY = 'f738d53ea69e7fdd825364d81d17af21';
        // =========================================================================

        const cities = [
            { name: "서울", country: "대한민국", lat: 37.5665, lng: 126.9780 },
            { name: "부산", country: "대한민국", lat: 35.1796, lng: 129.0756 },
            { name: "인천", country: "대한민국", lat: 37.4563, lng: 126.7052 },
            { name: "대구", country: "대한민국", lat: 35.8714, lng: 128.6014 },
            { name: "광주", country: "대한민국", lat: 35.1595, lng: 126.8526 },
            { name: "대전", country: "대한민국", lat: 36.3510, lng: 127.3850 },
            { name: "제주", country: "대한민국", lat: 33.4996, lng: 126.5312 },
            { name: "장흥", country: "대한민국", lat: 34.6817, lng: 126.9073 },
            { name: "도쿄", country: "일본", lat: 35.6762, lng: 139.6503 },
            { name: "런던", country: "영국", lat: 51.5074, lng: -0.1278 },
            { name: "뉴욕", country: "미국", lat: 40.7128, lng: -74.0060 },
            { name: "파리", country: "프랑스", lat: 48.8566, lng: 2.3522 }
        ];

        let map;
        const markers = {};

        function initMap() {
            if (typeof L === 'undefined') return;

            map = L.map('map', { zoomControl: false }).setView([36.5, 127.5], 7);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            const mainTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            mainTile.on('tileerror', function() {
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    attribution: '&copy; CartoDB'
                }).addTo(map);
            });

            setupCities();

            setTimeout(() => { map.invalidateSize(); }, 200);
        }

        function setupCities() {
            const selectEl = document.getElementById('citySelect');

            cities.forEach((city, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${city.name} (${city.country})`;
                selectEl.appendChild(option);

                // 코랄/오렌지색 마커 아이콘
                const customIcon = L.divIcon({
                    className: 'custom-pin-wrapper',
                    html: `
                        <div class="custom-pin-container">
                            <div class="custom-pin-pulse"></div>
                            <div class="custom-pin">
                                <div class="custom-pin-inner"></div>
                            </div>
                        </div>
                    `,
                    iconSize: [36, 36],
                    iconAnchor: [18, 36],
                    popupAnchor: [0, -36]
                });

                const marker = L.marker([city.lat, city.lng], { icon: customIcon }).addTo(map);
                markers[index] = marker;

                marker.on('click', () => {
                    fetchWeather(city, marker);
                });
            });
        }

        async function fetchWeather(city, marker) {
            marker.bindPopup(`
                <div class="weather-popup">
                    <h3>${city.name}</h3>
                    <div style="padding: 10px; color: #ff8e53;">⏳ 실시간 날씨 불러오는 중...</div>
                </div>
            `).openPopup();

            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lng}&appid=${API_KEY}&units=metric&lang=kr`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('API Error');
                
                const data = await response.json();
                renderWeatherPopup(marker, city, {
                    temp: Math.round(data.main.temp),
                    feels_like: Math.round(data.main.feels_like),
                    humidity: data.main.humidity,
                    wind: data.wind.speed,
                    description: data.weather[0].description,
                    icon: `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`
                }, false);
            } catch (err) {
                renderWeatherPopup(marker, city, getMockData(), true);
            }
        }

        function renderWeatherPopup(marker, city, data, isMock) {
            const popupHtml = `
                <div class="weather-popup">
                    <h3>${city.name}</h3>
                    <div class="country">${city.country}</div>
                    <div class="weather-info-box">
                        <img class="weather-icon" src="${data.icon}" alt="날씨" />
                        <div class="temp">${data.temp}°C</div>
                    </div>
                    <div class="desc">${data.description}</div>
                    <div class="weather-details">
                        <div>체감: <b>${data.feels_like}°C</b></div>
                        <div>습도: <b>${data.humidity}%</b></div>
                        <div>풍속: <b>${data.wind}m/s</b></div>
                        <div>위도: <b>${city.lat.toFixed(1)}°</b></div>
                    </div>
                    ${isMock ? `<div class="demo-notice">⚠️ API 키 활성화 대기 중 (활성화 전 샘플 데이터가 표시됩니다)</div>` : ''}
                </div>
            `;
            marker.bindPopup(popupHtml).openPopup();
        }

        function getMockData() {
            return {
                temp: Math.floor(Math.random() * 10) + 15,
                feels_like: Math.floor(Math.random() * 10) + 14,
                humidity: Math.floor(Math.random() * 30) + 50,
                wind: (Math.random() * 3 + 1).toFixed(1),
                description: "맑음 (시뮬레이션)",
                icon: "https://openweathermap.org/img/wn/01d@2x.png"
            };
        }

        function focusCity(index) {
            if (index === "") return;
            const city = cities[index];
            map.flyTo([city.lat, city.lng], 10, { duration: 1.2 });
            setTimeout(() => fetchWeather(city, markers[index]), 1300);
        }
    </script>
</body>
</html>
